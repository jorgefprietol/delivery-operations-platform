name: CI and Delivery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies with hash verification
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
          node --check delivery/static/app.js
      - name: Test governance, concurrency, recovery and persistence
        run: python -m pytest
      - name: Check reproducible monitoring assets
        run: |
          python scripts/build-dashboard.py
          git diff --exit-code -- observability/grafana/dashboards/delivery.json
      - name: Audit runtime dependencies
        run: python -m pip_audit --require-hashes -r requirements.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-${{ matrix.os }}
          path: artifacts/
          retention-days: 14

  infrastructure:
    name: Validate infrastructure and monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Actions syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f
      - name: Validate Terraform and locked provider
        run: |
          terraform_image='hashicorp/terraform@sha256:c7926feace05d0f7e73542842bf3945924e955a1f782cf000ccbb8d18fa42d77'
          docker run --rm -v "$PWD/infra:/infra" -w /infra "$terraform_image" fmt -check
          docker run --rm -v "$PWD/infra:/infra" -w /infra "$terraform_image" init -backend=false -lockfile=readonly
          docker run --rm -v "$PWD/infra:/infra" -w /infra "$terraform_image" validate
      - name: Validate alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observability:/etc/prometheus:ro" \
            prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e check rules /etc/prometheus/alerts.yml
      - name: Scan repository for secrets
        run: |
          docker run --rm -v "$PWD:/source:ro" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners secret --skip-dirs /source/.git,/source/infra/.terraform --exit-code 1 /source

  integration:
    name: Container and operational integration
    needs: [quality, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_IMAGE: delivery-operations-platform:ci
      SOURCE_REVISION: ${{ github.sha }}
      EVIDENCE_MODE: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare isolated stack
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python scripts/init-env.py
          docker compose config --quiet
          docker build --build-arg "SOURCE_REVISION=$SOURCE_REVISION" -t "$APP_IMAGE" .
          docker compose up -d --no-build --wait --wait-timeout 240
      - name: Verify delivery lifecycle, Prometheus and Grafana provisioning
        run: |
          python scripts/e2e.py --prometheus-url http://127.0.0.1:19095
          python scripts/check-monitoring.py
          docker compose restart api
          python scripts/check-persistence.py
      - name: Block fixable HIGH and CRITICAL image vulnerabilities; generate SBOM
        run: |
          mkdir -p artifacts/security
          scanner='aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969'
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy -v "$PWD/artifacts/security:/reports" \
            "$scanner" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output /reports/vulnerabilities.json "$APP_IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts/security:/reports" \
            "$scanner" image --format cyclonedx --output /reports/sbom.cdx.json "$APP_IMAGE"
      - name: Save exact verified image
        if: github.event_name != 'pull_request'
        run: docker save "$APP_IMAGE" | gzip > artifacts/image.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: verified-image
          path: artifacts/image.tar.gz
          retention-days: 1
      - name: Collect diagnostics and stop ephemeral environment
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose-logs.txt
          docker compose down --volumes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-evidence
          path: |
            artifacts/*.json
            artifacts/*.txt
            artifacts/security/
          retention-days: 14

  publish:
    name: Publish verified image and provenance
    needs: integration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-image
          path: release
      - name: Publish without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gzip -dc release/image.tar.gz | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag delivery-operations-platform:ci "$REGISTRY_IMAGE:sha-$COMMIT_SHA"
          docker tag delivery-operations-platform:ci "$REGISTRY_IMAGE:main"
          docker push "$REGISTRY_IMAGE:sha-$COMMIT_SHA"
          docker push "$REGISTRY_IMAGE:main"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:sha-$COMMIT_SHA" | cut -d@ -f2)
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Verified delivery: \`$REGISTRY_IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - name: Close registry session
        if: always()
        run: docker logout ghcr.io
